name: Full regression
on: [push, pull_request]
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Backend suite
        working-directory: work/race-voices
        run: python -X utf8 -m unittest discover -p "test_*.py"
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - run: python -m pip install -r requirements-desktop.txt
      - name: Desktop suite
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py"
